---
- name: Install enhancement tools via apt
  block:
    - name: Install inkscape, pngquant, optipng, nodejs, npm
      apt:
        name:
          - inkscape
          - pngquant
          - optipng
          - nodejs
          - npm
        state: present
  rescue:
    - name: Log enhancement apt failure
      lineinfile:
        path: /var/log/image-converter-install.log
        line: "{{ ansible_date_time.iso8601 }} — enhancement apt install failed: {{ ansible_failed_result.msg }}"
        create: true
